services:
  - type: web
    name: rubli-site
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: SITE_URL
        value: https://rubli.com.br
      - key: SUPPORT_URL
        value: https://wa.me/5569999695779
      - key: INSTAGRAM_URL
        value: https://www.instagram.com/rubliservicos/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /ads.txt
        name: Cache-Control
        value: no-cache
      - path: /robots.txt
        name: Cache-Control
        value: no-cache
      - path: /sitemap.xml
        name: Cache-Control
        value: no-cache
