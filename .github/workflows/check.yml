name: Verificar site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        env:
          SITE_URL: https://rubli.com.br
          SUPPORT_URL: https://wa.me/5569999695779
          INSTAGRAM_URL: https://www.instagram.com/rubliservicos/
